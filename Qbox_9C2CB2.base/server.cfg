## You CAN edit the following:
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"
sv_maxclients 48
set steam_webApiKey "none"
sets tags "default, deployer, qbox"

## You MAY edit the following:
sv_licenseKey "${FIVEM_LICENSE_KEY}"
sv_hostname "FLOG RP built by sorry_xoxo!"
sets sv_projectName "FLOG RP - Powered by sorry_xoxo"
sets sv_projectDesc "FLOG RP - Maintaned and Developed by Sorry_xoxo"
sets locale "en-GB" # replace with your language and location code, like en-US, pt-BR, etc
load_server_icon myLogo.png
set sv_enforceGameBuild 3258
set mysql_connection_string "mysql://root:@localhost/Qbox_9C2CB2?charset=utf8mb4"

# Chat config
set resources_useSystemChat true
set qbx_chat:joinMessage "^2%s joined the server"
set qbx_chat:quitMessage "^1%s left the server (%s)"

# Voice config
exec voice.cfg

# Qbox config
setr qb_locale "en"
setr qbx:enableBridge "true" # When true, enables the qb-core bridge for qbx_core
set qbx:enableQueue "true" # When true, enables qbx_core's built-in queue system
set qbx:bucketLockdownMode "inactive" # Sets the lockdown mode as inactive read here: https://docs.fivem.net/natives/?_0xA0F2201F
set qbx:discordLink "discord.gg/yyjYUeKPQP" # Sets the servers discord link
set qbx:max_jobs_per_player 5 # Sets the number of jobs per player
set qbx:max_gangs_per_player 1 # Sets the number of gangs per player
set qbx:setjob_replaces "false" # When true, the SetJob function deletes the previous primary job of the player before setting the new one
set qbx:setgang_replaces "true" # When true, the SetGang function deletes the previous primary gang of the player before setting the new one
set qbx:cleanPlayerGroups "true" # When true, on server startup, the database will be checked for any groups/grades players have that are not in config files and removes them from the database if so
set qbx:allowMethodOverrides "true" # When true, enables the ability of resources to override existing methods in the player object
set qbx:disableOverrideWarning "false" # When true, disables warnings from resources overriding existing methods in the player object
setr qbx:enableVehiclePersistence "false" # When true, player vehicles marked for persistence will be respawned when deleted
setr qbx:vehiclePersistenceType "semi" # When "full", player vehicles will also be respawned after server restarts, when "semi", they will only respawn when deleted
set qbx:acknowledge "true" # When true, disables the default service message
setr qbx:enableGroupManagement "false" # When true, allows bosses to manage job/gang grades. Specifically the grade name.

# Message displayed to players in the chat after loading in
setr qbx:motd "<div style='font-family:Arial,Helvetica,sans-serif;background:#111318;color:#ffffff;padding:25px;border-radius:10px;max-width:850px;margin:auto;'><div style='text-align:center;padding-bottom:20px;margin-bottom:20px;border-bottom:1px solid #292d36;'><h1 style='margin:0;font-size:32px;font-weight:bold;letter-spacing:1px;'>WELCOME TO THE CITY</h1><p style='margin:10px 0 0;color:#aeb4c0;font-size:15px;'>Your city. Your choices. Your story.</p></div><div style='background:#191c23;padding:20px;border-radius:8px;margin-bottom:18px;border-left:4px solid #c6a75e;'><h2 style='margin:0 0 12px;color:#c6a75e;font-size:21px;'>🚨 BEFORE YOU BEGIN</h2><p style='margin:0;color:#d8dbe1;line-height:1.6;'>Welcome to our FiveM roleplay community. Before entering the city, please make sure you understand and follow our server rules. Our goal is to provide realistic, immersive and enjoyable roleplay for everyone.</p><p style='margin:15px 0 0;color:#d8dbe1;line-height:1.9;'>🎭 <b>Stay in character</b> — Keep your actions and interactions realistic.<br>🚫 <b>No RDM / VDM</b> — Random deathmatching and vehicle deathmatching are not permitted.<br>🧠 <b>No Metagaming / Powergaming</b> — Do not use information or abilities your character would not have.<br>🤝 <b>Respect others</b> — Treat players and staff with respect.<br>🚓 <b>Respect emergency services</b> — Maintain realistic interactions with police, EMS and other services.<br>🛑 <b>No exploiting</b> — Do not abuse bugs, glitches or server systems.<br>📢 <b>Report problems</b> — Contact staff if you discover an issue.</p></div><div style='background:#191c23;padding:20px;border-radius:8px;margin-bottom:18px;'><h2 style='margin:0 0 12px;color:#c6a75e;font-size:21px;'>🌆 FIND YOUR PLACE</h2><p style='margin:0;color:#d8dbe1;line-height:1.7;'>Everyone has a place in the city. Build a career, start a business, meet new people or take a completely different path.</p><p style='margin:15px 0 0;color:#ffffff;line-height:2;'>🚓 Police Officer<br>🚑 Paramedic<br>🔧 Mechanic<br>🏢 Business Owner<br>💼 Entrepreneur<br>💰 Criminal<br>🚗 Civilian</p></div><div style='background:#191c23;padding:20px;border-radius:8px;margin-bottom:18px;'><h2 style='margin:0 0 12px;color:#c6a75e;font-size:21px;'>🎯 GET STARTED</h2><p style='margin:0;color:#d8dbe1;line-height:1.7;'>Starting your journey is simple. Create your character, explore the city, meet new people and find your place within the community.</p><p style='margin:15px 0 0;color:#d8dbe1;line-height:2;'><span style='color:#c6a75e;font-weight:bold;'>01</span> — Create your character<br><span style='color:#c6a75e;font-weight:bold;'>02</span> — Explore the city<br><span style='color:#c6a75e;font-weight:bold;'>03</span> — Meet new people<br><span style='color:#c6a75e;font-weight:bold;'>04</span> — Find your career<br><span style='color:#c6a75e;font-weight:bold;'>05</span> — Write your story</p></div><div style='background:#191c23;padding:20px;border-radius:8px;margin-bottom:18px;text-align:center;'><h2 style='margin:0 0 12px;color:#c6a75e;font-size:21px;'>📋 NEED HELP?</h2><p style='margin:0;color:#d8dbe1;line-height:1.6;'>If you need assistance, encounter a problem or are unsure what to do, contact a member of the staff team through the appropriate support channel.</p></div><div style='text-align:center;padding-top:20px;border-top:1px solid #292d36;'><p style='margin:0;color:#858b96;font-size:13px;'>Thank you for being part of our community.</p><p style='margin:10px 0 0;color:#c6a75e;font-weight:bold;font-size:15px;'>HAVE FUN • STAY RESPECTFUL • ROLEPLAY PROPERLY</p><p style='margin:8px 0 0;color:#626873;font-size:12px;'>Your story starts now.</p></div></div>"
